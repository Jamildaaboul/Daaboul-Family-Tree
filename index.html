<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>The Daaboul Family Tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;transition:all 0.3s ease}
        :root{--bg1:#667eea;--bg2:#764ba2;--header-bg:#dcdcdc;--card-bg:rgba(255,255,255,0.95);--text:#333;--text-light:#666;--modal-bg:#fff;--toast-bg:#333;--toast-color:#fff;--line-color:#888}
        .dark-mode{--bg1:#1a1a2e;--bg2:#16213e;--header-bg:#0f3460;--card-bg:rgba(30,30,50,0.95);--text:#e0e0e0;--text-light:#aaa;--modal-bg:#1e1e3e;--toast-bg:#e0e0e0;--toast-color:#333;--line-color:#aaa}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;overflow:hidden}
        .header{background:var(--header-bg);padding:8px 15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px;box-shadow:0 4px 20px rgba(0,0,0,0.2);position:sticky;top:0;z-index:100}
        .header-left{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
        .btn-back,.back-nav{z-index:200!important;position:relative}
        .header button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:10px;font-weight:600;color:#fff}
        .header button:hover:not(:disabled){opacity:0.85;transform:translateY(-1px)}
        .header button:disabled{opacity:0.5;cursor:not-allowed}
        .btn-add{background:#4CAF50}.btn-demo{background:#2196F3}.btn-export{background:#FF9800}.btn-import{background:#9C27B0}.btn-clear{background:#f44336}.btn-lock{background:#333}.btn-dark{background:#555}.btn-img{background:#0096FF}
        .btn-back{background:#FF5722;display:none}.btn-home{background:#8e44ad}
        .lock-indicator{font-size:10px;margin-left:4px;padding:2px 6px;border-radius:10px;background:#fff;color:#333}
        .title-box{background:#1a1a1a;padding:12px 30px;border-radius:30px;text-align:center;border:2px solid #d4af37}
        .family-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;font-style:italic;color:#fff;letter-spacing:3px}
        .family-subtitle{font-family:'Aref Ruqaa',serif;font-size:32px;font-weight:700;color:#d4af37;direction:rtl;margin-top:2px}
        .color-palette{display:flex;gap:4px;background:rgba(255,255,255,0.7);padding:4px 8px;border-radius:15px}
        .color-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent}
        .color-dot:hover{transform:scale(1.2)}.color-dot.active{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.5)}
        .tree-wrapper{width:100vw;height:calc(100vh - 90px);overflow:hidden;cursor:grab;position:relative;touch-action:none}
        .tree-wrapper:active{cursor:grabbing}
        .tree-container{position:absolute;padding:30px;transform-origin:0 0}
        .family-unit{display:flex;flex-direction:column;align-items:center}
        .couple-row,.single-row{display:flex;align-items:center;gap:10px;background:var(--card-bg);padding:10px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.1)}
        .person-card{text-align:center;padding:10px;border-radius:10px;min-width:110px;position:relative;cursor:pointer;border:4px solid #FFD700;color:var(--text)}
        .person-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,0.2)}
        .person-card.male{background:linear-gradient(135deg,#e3f2fd,#bbdefb)}.person-card.female{background:linear-gradient(135deg,#fce4ec,#f8bbd0)}
        .photo-container{width:60px;height:60px;border-radius:50%;margin:0 auto 5px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f0f0f0;border:4px solid #FFD700;cursor:pointer}
        .photo-container img{width:100%;height:100%;object-fit:cover}.photo-container .no-photo{font-size:22px;opacity:0.4}
        .person-card .name{font-weight:700;font-size:13px;color:var(--text)}.person-card .dates{font-size:9px;color:var(--text-light)}
        .person-card .actions{position:absolute;top:-8px;right:-8px;display:none;gap:3px;z-index:10}
        .person-card:hover .actions{display:flex}
        .person-card .actions button{width:20px;height:20px;border-radius:50%;border:2px solid #fff;cursor:pointer;font-size:10px;background:#fff}
        .children-section{display:flex;flex-direction:column;align-items:center;margin-top:6px}
   .children-connector {
    width: 5px;
    height: 35px;
    background: #4a3728;
    border-left: 1px solid #d4af37;
    border-right: 1px solid #d4af37;
    border-radius: 50% 50% 0 0;
}
.children-row {
    display: flex;
    gap: 14px;
    position: relative;
    padding-top: 35px;
}
.children-row::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: #4a3728;
    border-top: 1px solid #d4af37;
    border-bottom: 1px solid #d4af37;
    border-radius: 5px;
}
.child-wrapper {
    position: relative;
}
.child-wrapper::before {
    content: '';
    position: absolute;
    top: -35px;
    left: 50%;
    width: 5px;
    height: 35px;
    background: #4a3728;
    border-left: 1px solid #d4af37;
    border-right: 1px solid #d4af37;
    border-radius: 0 0 50% 50%;
}
        .add-btn{width:30px;height:30px;border-radius:50%;border:2px dashed #bbb;background:#fff;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:#999;margin:10px auto}
        .add-btn:hover{border-color:#4CAF50;color:#4CAF50;background:#f0f9f0;transform:scale(1.15)}
        .spouse-connector{font-size:16px;text-align:center}
        .gender-badge{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
        .gender-badge.male{background:#2196F3}.gender-badge.female{background:#e91e63}
        .deceased-badge{position:absolute;top:3px;right:3px;font-size:12px}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center}
        .modal.active{display:flex}.modal-content{background:var(--modal-bg);color:var(--text);padding:20px;border-radius:12px;width:90%;max-width:380px}
        .modal-content input,.modal-content textarea{width:100%;padding:6px;margin:4px 0;border:1px solid #ddd;border-radius:5px;font-size:12px}
        .date-group{display:flex;gap:6px}.date-group div{flex:1}.date-group label{font-size:9px;color:var(--text-light)}
        .gender-selection{display:flex;gap:6px;margin:6px 0}.gender-selection button{flex:1;padding:6px;border:2px solid #ddd;border-radius:5px;cursor:pointer;background:#fff;font-weight:600}
        .gender-selection button.selected{border-color:#4CAF50;background:#e8f5e9}
        .btn-group{display:flex;gap:6px;margin-top:12px}.btn-group button{flex:1;padding:8px;border:none;border-radius:5px;cursor:pointer;font-weight:700}
        .btn-save{background:#4CAF50;color:#fff}.btn-cancel{background:#eee;color:#333}
        .back-nav{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#FF5722;color:#fff;padding:6px 16px;border-radius:15px;z-index:90;display:none;cursor:pointer;font-weight:700;font-size:12px;border:none;border-radius:20px}
        .back-nav.show{display:block}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-color);padding:8px 20px;border-radius:20px;z-index:2000;display:none;font-size:12px}
        .toast.show{display:block;animation:fi 2s}@keyframes fi{0%{opacity:0}10%{opacity:1}90%{opacity:1}100%{opacity:0}}
        .hint-mobile{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:10px;font-size:9px;pointer-events:none;z-index:500}
        @media(max-width:768px){.family-title{font-size:20px}.family-subtitle{font-size:24px}.header button{padding:4px 8px;font-size:8px}.person-card{min-width:90px;padding:8px}.photo-container{width:50px;height:50px}.hint-mobile{display:block}}
        @media(min-width:769px){.hint-mobile{display:none}}
    </style>
</head>
<body>
<div class="header">
<div class="header-left">
<button class="btn-back" id="btnBack" onclick="goBack()">← BACK</button>
<button class="btn-home" onclick="goHome()">🏠</button>
<button class="btn-add" onclick="addRoot()">+ Root</button>
<button class="btn-demo" onclick="loadDemo()">Demo</button>
<button class="btn-export" onclick="exportTree()">Export</button>
<button class="btn-import" onclick="document.getElementById('ifile').click()">Import</button>
<button class="btn-img" onclick="exportAsImage()">📸 Image</button>
<button class="btn-clear" onclick="clearTree()">Clear</button>
<button class="btn-lock" id="btnLock" onclick="toggleLock()">🔒 Lock</button>
<button class="btn-dark" onclick="toggleDark()">🌙</button>
<span class="lock-indicator" id="lockIndicator">🔓 unlocked</span>
<input type="file" id="ifile" accept=".json" style="display:none" onchange="importTree(event)">
</div>
<div class="title-box"><div class="family-title">✦ The Daaboul Family Tree ✦</div><div class="family-subtitle">شجرة عائلة الدعبول</div></div>
<div class="color-palette" id="cpalette"></div>
</div>
<div class="back-nav" id="backNav" onclick="goBack()">◄ BACK TO MAIN TREE</div>
<div class="tree-wrapper" id="tw"><div class="tree-container" id="tc"></div></div>
<div class="hint-mobile" id="hintMobile">📱 Drag to move | Pinch to zoom | Tap person for lineage</div>
<div class="modal" id="modal"><div class="modal-content"><h2 id="mTitle">Add Person</h2>
<input type="text" id="mName" placeholder="Full Name">
<div class="date-group"><div><label>Birth</label><input type="date" id="mDob"></div><div><label>Death</label><input type="date" id="mDod"></div></div>
<div class="date-group"><div><label>Marriage</label><input type="date" id="mMarriage"></div></div>
<div><label>Notes</label><textarea id="mNotes"></textarea></div>
<div class="gender-selection"><button id="mMale" class="selected" onclick="selGender('male')">♂ Male</button><button id="mFemale" onclick="selGender('female')">♀ Female</button></div>
<input type="file" id="mPhoto" accept="image/*" onchange="prevPhoto(event)"><div id="mPreview"></div>
<div class="btn-group"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="savePerson()">💾 Save</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
var MT, FT, FoT=null, isF=false;
var z=1, tX=0, tY=0, isP=false, sX=0, sY=0, iTX=0, iTY=0;
var locked=false, darkMode=false;
var mA=null, mU=null, sG="male", pD=null, mDate="", mNotes="";

var colors=[["#667eea","#764ba2"],["#2E7D32","#1B5E20"],["#fc4a1a","#f7b733"],["#00b4db","#0083b0"],["#ee0979","#ff6a00"],["#348f50","#56b4d3"],["#b24592","#f15f79"],["#2c3e50","#3498db"]];
(function(){
    var cp=document.getElementById("cpalette");
    colors.forEach(function(c,i){
        var d=document.createElement("div"); d.className="color-dot"+(i===0?" active":"");
        d.style.background="linear-gradient(135deg,"+c[0]+","+c[1]+")";
        d.onclick=function(){ document.querySelectorAll(".color-dot").forEach(x=>x.classList.remove("active")); this.classList.add("active"); setBg(c[0],c[1]); };
        cp.appendChild(d);
    });
})();
function setBg(c1,c2){ document.documentElement.style.setProperty("--bg1",c1); document.documentElement.style.setProperty("--bg2",c2); }

// Small fallback default (shown only if daaboul.json is missing)
function buildDefaultTree(){
    MT = {
  "id": "id_1777647799861_5bct5j2k9",
  "person1": {
    "name": "Jamil",
    "dob": "",
    "dod": "",
    "gender": "male",
    "photo": null
  },
  "person2": {
    "name": "Nazira",
    "dob": "",
    "dod": "",
    "gender": "female",
    "photo": null
  },
  "children": [
    {
      "id": "id_1777647835654_u2pi9ubuf",
      "person1": {
        "name": "Joseph",
        "dob": "1926-10-29",
        "dod": "1987-08-27",
        "gender": "male",
        "photo": null,
        "notes": ""
      },
      "person2": {
        "name": "Marie",
        "dob": "1931-04-16",
        "dod": "",
        "gender": "female",
        "photo": null,
        "notes": ""
      },
      "children": []
    }
  ]
};
    FT=MT;
    FoT=null;
    renderTree();
}

function loadData(){
    fetch('daaboul.json').then(r=>r.json()).then(d=>{MT=d;FT=MT;FoT=null;renderTree();}).catch(e=>{buildDefaultTree();});
}

function saveData(){ localStorage.setItem('daaboul',JSON.stringify(MT)); }

function renderTree(){
    var tc=document.getElementById('tc');
    tc.innerHTML='';
    if(FT) renderUnit(FT,tc);
}

function renderUnit(u,p){
    var fu=document.createElement('div');
    fu.className='family-unit';
    fu.style.cursor='pointer';
    
    if(u.person1||u.person2){
        var cr=document.createElement('div');
        cr.className='couple-row';
        if(u.person1) cr.appendChild(createPersonCard(u.person1,u.id));
        if(u.person1&&u.person2) cr.appendChild(document.createElement('div')).innerHTML='💍';
        if(u.person2) cr.appendChild(createPersonCard(u.person2,u.id));
        fu.appendChild(cr);
    }
    
    if(u.children&&u.children.length>0){
        var cs=document.createElement('div');
        cs.className='children-section';
        cs.appendChild(document.createElement('div')).className='children-connector';
        
        var row=document.createElement('div');
        row.className='children-row';
        u.children.forEach(c=>{
            var w=document.createElement('div');
            w.className='child-wrapper';
            renderUnit(c,w);
            row.appendChild(w);
        });
        cs.appendChild(row);
        fu.appendChild(cs);
    }
    
    p.appendChild(fu);
}

function createPersonCard(p,uid){
    var pc=document.createElement('div');
    pc.className='person-card '+p.gender;
    pc.onclick=function(e){e.stopPropagation();viewLineage(uid);};
    
    var gb=document.createElement('div');
    gb.className='gender-badge '+p.gender;
    gb.innerHTML=p.gender==='male'?'♂':'♀';
    pc.appendChild(gb);
    
    if(p.photo){
        var pho=document.createElement('div');
        pho.className='photo-container';
        var img=document.createElement('img');
        img.src=p.photo;
        pho.appendChild(img);
        pc.appendChild(pho);
    }else{
        var pho=document.createElement('div');
        pho.className='photo-container';
        pho.innerHTML='<div class="no-photo">👤</div>';
        pc.appendChild(pho);
    }
    
    var nm=document.createElement('div');
    nm.className='name';
    nm.innerHTML=p.name||'Unknown';
    pc.appendChild(nm);
    
    var dt=document.createElement('div');
    dt.className='dates';
    var ds='';
    if(p.dob) ds+=p.dob.substring(0,4);
    if(p.dod) ds+=' - '+p.dod.substring(0,4);
    dt.innerHTML=ds;
    pc.appendChild(dt);
    
    if(p.dod){
        var db=document.createElement('div');
        db.className='deceased-badge';
        db.innerHTML='✝️';
        pc.appendChild(db);
    }
    
    var ac=document.createElement('div');
    ac.className='actions';
    var eb=document.createElement('button');
    eb.innerHTML='✎';
    eb.onclick=function(e){e.stopPropagation();editPerson(uid,p===findPersonInTree(MT,uid).p1?'p1':'p2');};
    var db=document.createElement('button');
    db.innerHTML='✕';
    db.onclick=function(e){e.stopPropagation();if(!locked)delPerson(uid,p===findPersonInTree(MT,uid).p1?'p1':'p2');};
    ac.appendChild(eb);
    ac.appendChild(db);
    pc.appendChild(ac);
    
    return pc;
}

function findPersonInTree(n,uid){
    if(n.id===uid) return {node:n};
    if(n.children) for(let c of n.children){
        let r=findPersonInTree(c,uid);
        if(r) return r;
    }
}

function findUnitById(n,uid){
    if(n.id===uid) return n;
    if(n.children) for(let c of n.children){
        let r=findUnitById(c,uid);
        if(r) return r;
    }
}

function viewLineage(uid){
    let u=findUnitById(MT,uid);
    if(u){
        FoT=FT;
        FT=u;
        document.getElementById('btnBack').style.display='block';
        document.getElementById('backNav').classList.add('show');
        z=1;tX=0;tY=0;
        updateTransform();
        renderTree();
        showToast(FT.person1?.name+' & '+FT.person2?.name);
    }
}

function goBack(){
    if(FoT){
        FT=FoT;
        FoT=null;
        document.getElementById('btnBack').style.display='none';
        document.getElementById('backNav').classList.remove('show');
        z=1;tX=0;tY=0;
        updateTransform();
        renderTree();
    }
}

function goHome(){
    FT=MT;
    FoT=null;
    document.getElementById('btnBack').style.display='none';
    document.getElementById('backNav').classList.remove('show');
    z=1;tX=0;tY=0;
    updateTransform();
    renderTree();
    showToast('Home');
}

function addRoot(){ openModal(null,'Add Root'); }

function addChild(uid){
    if(locked){ showToast('🔒 Locked'); return; }
    let u=findUnitById(MT,uid);
    if(u){
        if(!u.children) u.children=[];
        mU=u;
        openModal(null,'Add Child');
    }
}

function addSpouse(uid){
    if(locked){ showToast('🔒 Locked'); return; }
    let u=findUnitById(MT,uid);
    if(u&&u.person1&&!u.person2){
        mU=u;
        mA='person2';
        openModal(null,'Add Spouse');
    }
}

function editPerson(uid,key){
    if(locked){ showToast('🔒 Locked'); return; }
    let u=findUnitById(MT,uid);
    if(u){
        let p=u[key];
        if(p){
            mU=u;
            mA=key;
            document.getElementById('mName').value=p.name||'';
            document.getElementById('mDob').value=p.dob||'';
            document.getElementById('mDod').value=p.dod||'';
            document.getElementById('mMarriage').value=u.marriage||'';
            document.getElementById('mNotes').value=p.notes||'';
            sG=p.gender||'male';
            document.getElementById('mMale').classList.toggle('selected',sG==='male');
            document.getElementById('mFemale').classList.toggle('selected',sG==='female');
            pD=p.photo;
            document.getElementById('mPreview').innerHTML=pD?'<img src="'+pD+'" style="width:80px;height:80px;border-radius:8px;">':'';
            openModal(null,'Edit Person');
        }
    }
}

function delPerson(uid,key){
    if(confirm('Delete this person?')){
        let u=findUnitById(MT,uid);
        if(u) u[key]=null;
        saveData();
        renderTree();
        showToast('Deleted');
    }
}

function openModal(e,t){
    document.getElementById('mTitle').innerHTML=t;
    document.getElementById('modal').classList.add('active');
}

function closeModal(){
    document.getElementById('modal').classList.remove('active');
    document.getElementById('mName').value='';
    document.getElementById('mDob').value='';
    document.getElementById('mDod').value='';
    document.getElementById('mMarriage').value='';
    document.getElementById('mNotes').value='';
    document.getElementById('mPreview').innerHTML='';
    mU=null;mA=null;pD=null;
}

function selGender(g){ sG=g; document.getElementById('mMale').classList.toggle('selected',g==='male'); document.getElementById('mFemale').classList.toggle('selected',g==='female'); }

function prevPhoto(e){
    let f=e.target.files[0];
    if(f){
        let r=new FileReader();
        r.onload=function(ev){
            pD=ev.target.result;
            document.getElementById('mPreview').innerHTML='<img src="'+pD+'" style="width:80px;height:80px;border-radius:8px;">';
        };
        r.readAsDataURL(f);
    }
}

function savePerson(){
    let n=document.getElementById('mName').value.trim();
    if(!n){ showToast('Name required'); return; }
    
    if(!mU){
        MT={id:'id_'+Date.now()+'_'+Math.random().toString(36).substring(7),person1:{name:n,dob:document.getElementById('mDob').value,dod:document.getElementById('mDod').value,gender:sG,photo:pD,notes:document.getElementById('mNotes').value},person2:null,children:[]};
    }else if(!mA){
        let c={id:'id_'+Date.now()+'_'+Math.random().toString(36).substring(7),person1:{name:n,dob:document.getElementById('mDob').value,dod:document.getElementById('mDod').value,gender:sG,photo:pD,notes:document.getElementById('mNotes').value},person2:null,children:[]};
        if(!mU.children) mU.children=[];
        mU.children.push(c);
    }else{
        mU[mA]={name:n,dob:document.getElementById('mDob').value,dod:document.getElementById('mDod').value,gender:sG,photo:pD,notes:document.getElementById('mNotes').value};
    }
    mU.marriage=document.getElementById('mMarriage').value;
    
    saveData();
    closeModal();
    renderTree();
    showToast('Saved');
}

function exportTree(){
    let d=JSON.stringify(MT,null,2);
    let e=document.createElement('a');
    e.href='data:text/json;charset=utf-8,'+encodeURIComponent(d);
    e.download='daaboul.json';
    e.click();
    showToast('Exported');
}

function importTree(e){
    let f=e.target.files[0];
    if(f){
        let r=new FileReader();
        r.onload=function(ev){
            try{
                MT=JSON.parse(ev.target.result);
                FT=MT;
                FoT=null;
                document.getElementById('btnBack').style.display='none';
                document.getElementById('backNav').classList.remove('show');
                z=1;tX=0;tY=0;
                updateTransform();
                renderTree();
                saveData();
                showToast('Imported');
            }catch(err){
                showToast('Error importing');
            }
        };
        r.readAsText(f);
    }
}

function clearTree(){
    if(confirm('Clear all data?')){
        MT=null;
        FT=null;
        FoT=null;
        document.getElementById('tc').innerHTML='';
        localStorage.removeItem('daaboul');
        showToast('Cleared');
    }
}

function exportAsImage(){
    html2canvas(document.getElementById('tc'),{scale:2}).then(c=>{
        let a=document.createElement('a');
        a.href=c.toDataURL();
        a.download='family-tree.png';
        a.click();
        showToast('Image exported');
    });
}

function toggleLock(){
    locked=!locked;
    document.getElementById('btnLock').innerHTML=locked?'🔐 Locked':'🔒 Lock';
    document.getElementById('lockIndicator').innerHTML=locked?'🔐 locked':'🔓 unlocked';
    showToast(locked?'🔐 Locked':'🔓 Unlocked');
}

function toggleDark(){
    darkMode=!darkMode;
    document.documentElement.classList.toggle('dark-mode',darkMode);
    showToast(darkMode?'🌙 Dark':'☀️ Light');
}

function showToast(m){
    let t=document.getElementById('toast');
    t.innerHTML=m;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
}

// MOUSE/TOUCH INTERACTIONS
var tw=document.getElementById('tw');
tw.addEventListener('mousedown',startDrag);
tw.addEventListener('touchstart',startDrag);
tw.addEventListener('mousemove',dragMove);
tw.addEventListener('touchmove',dragMove,{passive:false});
tw.addEventListener('mouseup',stopDrag);
tw.addEventListener('touchend',stopDrag);
tw.addEventListener('wheel',doZoom,{passive:false});

function startDrag(e){
    if(isP) return;
    isP=true;
    sX=(e.touches?e.touches[0].clientX:e.clientX)-tX;
    sY=(e.touches?e.touches[0].clientY:e.clientY)-tY;
    if(e.touches&&e.touches.length===2){
        let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        iTX=tX;
        iTY=tY;
    }
}

function dragMove(e){
    if(!isP) return;
    if(e.touches&&e.touches.length===2){
        e.preventDefault();
        let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        let od=Math.hypot(sX,sY);
        if(od>0) z*=d/od;
        z=Math.max(0.1,Math.min(3,z));
        sX=d;
        updateTransform();
    }else{
        tX=(e.touches?e.touches[0].clientX:e.clientX)-sX;
        tY=(e.touches?e.touches[0].clientY:e.clientY)-sY;
        updateTransform();
    }
}

function stopDrag(e){ isP=false; }

function doZoom(e){
    e.preventDefault();
    z+=e.deltaY>0?-0.1:0.1;
    z=Math.max(0.1,Math.min(3,z));
    updateTransform();
}

function updateTransform(){
    document.getElementById('tc').style.transform='translate('+tX+'px,'+tY+'px) scale('+z+')';
}

// INITIALIZE ON PAGE LOAD
window.addEventListener('DOMContentLoaded',function(){
    loadData();
});
</script>
